[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "catml"
dynamic = ["version"]
description = "The Agent-Native AutoML Engine for Humans and AI Agents"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = [
    "LICENSE",
    "NOTICE",
    "THIRD_PARTY_LICENSES.md",
]
authors = [{ name = "Jfenic" }]
maintainers = [{ name = "Jfenic" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.4.0",
    "pyyaml>=6.0",
    "optuna>=3.0",
    "scipy>=1.10",
    "joblib>=1.3",
]

[project.urls]
Homepage = "https://catml.vercel.app"
Repository = "https://github.com/Jfenic/catml"
Issues = "https://github.com/Jfenic/catml/issues"
Documentation = "https://github.com/Jfenic/catml#readme"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "build>=1.0",
    "wheel>=0.40",
    "pyarrow>=14.0",
    "ruff>=0.8",
    "mypy>=1.13",
]
mcp = [
    "mcp>=1.2.0",
]
agents = [
    "langgraph>=0.2.0",
    "langgraph-checkpoint>=2.0.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
]
models = [
    "catboost>=1.2",
    "lightgbm>=4.0",
    "xgboost>=2.0",
]
vision = [
    "torch>=2.0",
    "torchvision>=0.15",
    "timm>=0.9",
    "pillow>=9.0",
]
parquet = [
    "pyarrow>=14.0",
]
all = [
    "catml[models,mcp,agents,vision,parquet]",
]

[project.scripts]
catml = "automl.interfaces.cli.main:main"
automl = "automl.interfaces.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"automl.interfaces.web" = [
    "static/**/*.html",
    "static/**/*.css",
    "static/**/*.js",
    "static/**/*.svg",
    "static/**/*.png",
    "static/**/*.ico",
    "static/**/*.woff",
    "static/**/*.woff2",
    "static/**/*.ttf",
    "static/**/*.txt",
    "static/**/*.md",
]

[tool.setuptools.dynamic]
version = {attr = "automl.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore:Setting the shape on a NumPy array has been deprecated in NumPy 2.5:DeprecationWarning:joblib.*",
]

# Clean Arch PR5 — gradual quality gates (domain strict; application ignores debt).
[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]

[tool.ruff.lint]
# Gradual gate: pyflakes + selected correctness/style; E501 deferred.
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "C4",
    "RUF",
]
ignore = [
    "E501",  # line length — format later / Prettier for JS
]

[tool.ruff.lint.per-file-ignores]
# Gradual: application still has blind-except / try-except-pass / suppress debt.
"src/automl/application/**" = [
    "BLE001",
    "S110",
    "SIM102",
    "SIM105",
    "SIM108",
    "B905",
    "E741",
    "PYI034",
    "PYI036",
    "G201",
    "TRY004",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = false
pretty = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "automl.domain.*"
disallow_untyped_defs = false
strict_optional = true

[[tool.mypy.overrides]]
module = "automl.application.*"
# Gradual: application typed incrementally after domain is green.
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "automl.application.bus.*",
    "automl.application.commands.*",
    "automl.application.queries.*",
    "automl.application.registries.*",
    "automl.application.bootstrap",
]
ignore_errors = false
